# Legacy Order Management System
server.port=8080

# Database (H2 in-memory for demo)
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (legacy debug tool)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging - using basic config
logging.level.root=INFO
logging.level.com.legacy=DEBUG
